[workspace]
resolver = "2"
members = [
    "crates/gig-core",
    "crates/gig-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["JC Zhang <jczhang@live.it>"]
description = "Agent-facing store for freelance orders: drafts, packages, delivery, payment, archive"
readme = "README.md"
repository = "https://github.com/jczhang02/gig"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"
minijinja = "2"
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
