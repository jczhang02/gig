[workspace]
resolver = "2"
members = [
    "crates/gig-core",
    "crates/gig-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["jc"]
repository = "https://github.com/jc/gig"

[workspace.dependencies]
# Shared versions pinned here
rusqlite = { version = "0.31", features = ["bundled", "time"] }
refinery = { version = "0.8", features = ["rusqlite"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "1"
directories = "5"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
owo-colors = "4"
tempfile = "3"
minijinja = "2"
ignore = "0.4"
arboard = "3"
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
